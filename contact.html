
<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artificial Intelligence Contact Form</title>
<style>
body{
    background-color: #05164cd8;  
    color:white; 
}


header{
    background-color: #1b2a59;
    text-align:center;
    font-size:80px;
    font-weight: bold;
    font-family:"Lato";
    
}

/* Navigation */  

ul {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #1567d23f;
  float:left; 
}

ul li {
  float: left;
}

ul li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-family:"Special Gothic";
  font-size: 18px;
  
}
ul li a:hover {
  background-color: #500404;
}
.form-container {
        width: 60%;
        margin: 30px auto;
        background-color: rgba(15,31,69,0.8);
        padding: 30px;
        border-radius: 12px;
    }

    .form-container label {
        display: block;
        margin: 12px 0 6px;
    }

    .form-container input, .form-container select, .form-container textarea {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: none;
        margin-bottom: 15px;
    }

    .form-container input[type="submit"], .form-container input[type="reset"] {
        width: auto;
        padding: 10px 25px;
        margin-right: 10px;
        background-color: #4da6ff;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
        border: none;
    }

    .form-container input[type="submit"]:hover,
    .form-container input[type="reset"]:hover {
        background-color: #79c2ff;
    }

    .form-container .checkbox-group, .form-container .radio-group {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
    }

.download-link {
    background-color: #4da6ff;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.download-link:hover {
    background-color: #79c2ff;
}


</style>
</head>

  <header>
    Artificial Intelligence

<div class="form-container">
  <form>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" >

    <label for="email">Email Address:</label>
    <input type="text" id="email" name="email" >

    <label>Subscribe to Newsletter:</label>
    <div class="checkbox-group">
      <input type="checkbox" id="weekly" name="newsletter" value="weekly">
      <label for="weekly">Weekly</label>
      <input type="checkbox" id="monthly" name="newsletter" value="monthly">
      <label for="monthly">Monthly</label>
    </div>

    <label>Gender:</label>
    <div class="radio-group">
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label>
    </div>

<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob">

    <label for="subject">Subject:</label>
    <select id="subject" name="subject">
      <option value="general">General Inquiry</option>
      <option value="feedback">Feedback</option>
      <option value="support">Support</option>
    </select>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="5" placeholder="Type your message here..."></textarea>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</div>

<div style="text-align:center; margin: 20px;">

</div>
